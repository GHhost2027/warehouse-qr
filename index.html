<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Warehouse Instructions</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: white;
    color: black;
    font-family: Arial, Helvetica, sans-serif;
}

main {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

#message {
    font-size: clamp(40px, 9vw, 90px);
    font-weight: 800;
    line-height: 1.2;
    overflow-wrap: anywhere;
    margin: 0;
}

#code {
    margin-top: 30px;
    font-size: 18px;
    color: #666;
}
</style>
</head>

<body>
<main>
    <h1 id="message">PLEASE PLACE ITEMS HERE</h1>
    <div id="code"></div>
</main>

<script>
const messages = {
    "001": "🎁 恭喜你！獲得神秘禮物一份！",
    "002": "😂 請揀一位朋友，向佢講：「你今日份外有型！",
    "003": "🎁 請到1號枱枱底或凳底找尋一個利是封，然後讀出利是封嘅內容，祝你好運！",
    "004": "😂 請揀一位朋友，同佢講：「今晚你真係好靚！",
    "005": "😜 今次未中獎，食完呢餐就會轉運！",
    "006": "😜  請向對面嘅朋友送出一個超級燦爛笑容！ 😂",
    "007": "😜 今次未中獎，今晚食多兩啖！",
    "008": "🎁 請到2號枱枱底或凳底找尋一個利是封，然後讀出利是封嘅內容，祝你好運！",
    "009": "😜 今次未中獎！但恭喜你完成今晚抽獎！🎉",
    "010": "🍰 恭喜你！獲得甜品一份！🍰"
};

const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "001";

const message = messages[id];

if (message) {
    document.getElementById("message").textContent = message;
    document.getElementById("code").textContent =
        "Instruction " + id;

    document.title = "Instruction " + id;
} else {
    document.getElementById("message").textContent =
        "MESSAGE NOT FOUND";

    document.getElementById("code").textContent =
        "Please check the QR code.";
}
</script>

</body>
</html>
